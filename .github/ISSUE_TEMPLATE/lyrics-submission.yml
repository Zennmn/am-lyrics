name: 歌词投稿
description: 提交新的 Apple Music TTML 歌词以供审核
title: "[歌词投稿] "
labels: ["lyrics-submission"]
body:
  - type: markdown
    attributes:
      value: |
        感谢为本歌词库投稿。请填写以下表单，维护者审核通过后会代为上传。

  - type: input
    id: apple-music-id
    attributes:
      label: Apple Music ID
      description: 歌曲的 Apple Music 数字 ID（AM++ 使用）。可在 AM++ 编辑器里通过“获取 ID”获取。
      placeholder: "例如：1879820931"
    validations:
      required: true

  - type: input
    id: artist
    attributes:
      label: 歌手
      description: 歌词列表中显示的歌手名。
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: 歌名
    validations:
      required: true

  - type: textarea
    id: ttml
    attributes:
      label: TTML 内容
      description: 在此粘贴 Apple Music Word-TTML。必须包含 `<tt>`、`<body>` 和逐词 `<span>` 时间轴，且符合 AM++ 限制（不超过 512 KiB）。
      render: xml
    validations:
      required: true

  - type: checkboxes
    id: rights
    attributes:
      label: 权利声明
      description: 本仓库为公开仓库。歌词版权归原始权利人所有。
      options:
        - label: 我拥有发布或再分发这首歌词/翻译的权利，或者这是我自己创作的。
          required: true
        - label: 我理解歌词合并后将会公开，必要时可以移除。
          required: true
